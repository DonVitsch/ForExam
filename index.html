<!-- index.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>考试自测系统</title>
  <link rel="stylesheet" href="css/style.css?v=20260716-3" />
  <link rel="stylesheet" href="css/oil.css?v=20261102-5" />
</head>
<body>
<div class="scene" aria-hidden="true">
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>
  <div class="orb orb-c"></div>
</div>

<header class="site-header"><a class="site-brand" href="index.html">ForExam</a><span>首页</span></header>
<main class="app-shell home-shell">
  <section class="hero-card">
    <h1>开始学习</h1>
  </section>

  <section class="panel">
    <div class="section-title">
      <h2>选择科目</h2>
      <span id="subjectCount" class="badge">3</span>
    </div>
    <div id="subjectList" class="card-grid">
      <a class="subject-card" href="subject.html?subj=web-crawler">
        <div>
          <h3>网络信息提取与编程</h3>
          <p>点击进入科目</p>
        </div>
        <p>开始学习 →</p>
      </a>

      <a class="subject-card" href="subject.html?subj=java">
        <div>
          <h3>Java</h3>
          <p>点击进入科目</p>
        </div>
        <p>开始学习 →</p>
      </a>

      <a class="subject-card" href="subject.html?subj=android-development">
        <div>
          <h3>Android开发</h3>
          <p>点击进入科目</p>
        </div>
        <p>开始学习 →</p>
      </a>
    </div>
  </section>
<section class="mistake-section"><h2>错题本</h2>
<nav class="dock home-dock">
  <button id="mistakeBookBtn" class="dock-btn dock-btn-primary danger-soft" type="button">
    错题本
    <span id="mistakeCount" class="pill">0</span>
  </button>
  <button id="clearMistakesBtn" class="dock-btn dock-btn-ghost clear-btn" type="button">清空错题本</button>
</nav>
</section>
</main>

<script>
  const INDEX_MISTAKE_KEY = "exam_self_test_mistakes_v1";
  const INDEX_RETRY_KEY = "__mistake_retry__";

  function getIndexMistakeCount() {
    try {
      const raw = localStorage.getItem(INDEX_MISTAKE_KEY);
      const data = raw ? JSON.parse(raw) : {};
      return Object.values(data).reduce((sum, list) => {
        return sum + (Array.isArray(list) ? list.length : 0);
      }, 0);
    } catch (error) {
      return 0;
    }
  }

  const mistakeCount = document.querySelector("#mistakeCount");
  const mistakeBookBtn = document.querySelector("#mistakeBookBtn");

  if (mistakeCount) {
    mistakeCount.textContent = String(getIndexMistakeCount());
  }

  if (mistakeBookBtn) {
    mistakeBookBtn.addEventListener("click", () => {
      window.location.href = `exam.html?subj=${encodeURIComponent(INDEX_RETRY_KEY)}&type=mistakes`;
    });
  }

  const clearMistakesBtn = document.querySelector("#clearMistakesBtn");
  if (clearMistakesBtn) {
    clearMistakesBtn.addEventListener("click", () => {
      if (!confirm("确定要清空所有错题吗？此操作不可恢复。")) return;
      localStorage.removeItem(INDEX_MISTAKE_KEY);
      if (mistakeCount) mistakeCount.textContent = "0";
    });
  }
</script>
<script src="js/app.js?v=20261102-5"></script>
</body>
</html>
